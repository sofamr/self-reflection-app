<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reflect - Text Yourself & Journal</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Favicons & Touch Icons -->
  <link rel="icon" type="image/png" href="./favicon.png?v=2">
  <link rel="apple-touch-icon" href="./icon-192.png?v=2">

  <!-- Web App Manifest -->
  <link rel="manifest" href="./manifest.json?v=2">
  <meta id="metaThemeColor" name="theme-color" content="#00bf57">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appGreen: 'var(--color-primary, #00bf57)',
            appBlue: 'var(--color-secondary, #009abb)',
            appDarkBg: '#0b1120',
            appDarkCard: '#1e293b',
            appDarkSurface: '#151f32'
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter (Default), Cantarell, Alata -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Cantarell:ital,wght@0,400;0,700;1,400" rel="stylesheet">
</head>

<body class="bg-slate-200 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased overflow-hidden flex justify-center selection:bg-teal-300 theme-transition">

  <!-- Mobile Max Width App Shell -->
  <div id="appShell" class="w-full max-w-md bg-white dark:bg-appDarkBg app-viewport flex flex-col relative overflow-hidden shadow-2xl border-x border-slate-200/50 dark:border-slate-800/80 theme-transition">

    <!-- ========================================== -->
    <!-- VIEW 1: HOME PAGE (Conversations List)    -->
    <!-- ========================================== -->
    <section id="viewHome" class="flex-1 flex flex-col h-full bg-[#f8fafc] dark:bg-appDarkBg theme-transition">
      
      <!-- Top App Bar -->
      <header class="px-5 pt-safe pt-4 pb-3 bg-white dark:bg-appDarkSurface border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between shadow-xs theme-transition">
        <div class="flex items-center space-x-3">
          <div class="theme-accent-gradient w-9 h-9 rounded-2xl flex items-center justify-center text-white shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white leading-none">Reflect</h1>
            <p class="text-[11px] font-medium text-slate-400 dark:text-slate-400 mt-1">Text Yourself</p>
          </div>
        </div>

        <!-- Header Controls: Journal Toggle & Settings -->
        <div class="flex items-center space-x-1">
          <!-- Journal Book Icon Toggle -->
          <button 
            id="btnToggleJournalHome" 
            title="Journal Library"
            aria-label="Open Journal" 
            class="journal-toggle-btn w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </button>

          <!-- Settings Icon -->
          <button 
            id="btnSettingsHome" 
            title="Settings"
            aria-label="Settings" 
            class="settings-open-btn w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Search Filter Bar -->
      <div class="px-4 py-3 bg-white dark:bg-appDarkSurface border-b border-slate-100 dark:border-slate-800/80 theme-transition">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Search past reflections..." 
            class="w-full pl-9 pr-4 py-2 bg-slate-100/90 dark:bg-slate-800/90 rounded-xl text-[14px] text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#009abb]/40 focus:bg-white dark:focus:bg-slate-800 transition-all border border-transparent focus:border-slate-200 dark:focus:border-slate-700"
          />
        </div>
      </div>

      <!-- Chats List -->
      <main id="chatListContainer" class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5 no-scrollbar">
        <!-- Injected dynamically via JS -->
      </main>

      <!-- Bottom Floating New Chat Button -->
      <div class="p-4 bg-gradient-to-t from-white via-white/95 dark:from-appDarkBg dark:via-appDarkBg/95 to-transparent pb-safe border-t border-slate-100 dark:border-slate-800/80 theme-transition">
        <button 
          id="btnNewReflection"
          class="theme-accent-btn w-full py-3.5 px-5 text-white active:scale-[0.98] rounded-2xl font-semibold text-sm flex items-center justify-center space-x-2 shadow-lg transition-all"
        >
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
          <span>New Reflection</span>
        </button>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- VIEW 2: ACTIVE CHAT SCREEN / SHARED DIV   -->
    <!-- ========================================== -->
    <section id="viewChat" class="hidden flex-1 flex-col h-full bg-white dark:bg-appDarkBg relative theme-transition">
      
      <!-- Top Chat Header -->
      <header class="px-3 pt-safe pt-3 pb-2.5 bg-white/90 dark:bg-appDarkSurface/90 backdrop-blur border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between z-20 theme-transition">
        <button 
          id="btnBackToHome" 
          aria-label="Back" 
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
        >
          <svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <div id="chatHeaderTitle" class="flex-1 text-center px-2 cursor-pointer">
          <h2 id="activeChatTitle" class="font-bold text-slate-900 dark:text-white text-base leading-tight truncate">Chat Name</h2>
          <span id="activeChatSubtitle" class="text-[11px] text-slate-400 dark:text-slate-400 font-medium">Tap to rename</span>
        </div>

        <div class="flex items-center space-x-1">
          <!-- Journal Book Icon Toggle inside Chat View -->
          <button 
            id="btnToggleJournalChat"
            title="Journal Library"
            aria-label="Open Journal"
            class="journal-toggle-btn w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </button>

          <!-- Settings Icon inside Chat View -->
          <button 
            id="btnSettingsChat"
            title="Settings"
            aria-label="Settings"
            class="settings-open-btn w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>

          <!-- Chat Options Menu Button -->
          <button 
            id="btnChatMenu" 
            aria-label="Options" 
            class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Shared Container: Messages & Journal Tree render in this same div -->
      <main id="messagesContainer" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 no-scrollbar">
        <!-- Rendered dynamically -->
      </main>

      <!-- Bottom Chat Input Bar -->
      <footer id="chatFooterBar" class="p-3 bg-white dark:bg-appDarkSurface border-t border-slate-100 dark:border-slate-800/80 pb-safe theme-transition">
        
        <!-- Perspective Switch Toggle -->
        <div class="flex items-center justify-between mb-2 px-1">
          <div class="flex items-center space-x-2">
            <button 
              id="modeToggleSwitch" 
              type="button" 
              role="switch" 
              aria-checked="false" 
              class="w-[52px] h-7 rounded-full p-0.5 flex items-center cursor-pointer transition-colors duration-200 relative focus:outline-none"
            >
              <div id="toggleKnob" class="toggle-knob w-6 h-6 bg-white dark:bg-slate-100 rounded-full shadow-md"></div>
            </button>
            <span id="modeStatusLabel" class="text-xs font-semibold uppercase tracking-wide">
              Voice 1
            </span>
          </div>

          <span id="perspectiveHint" class="text-[11px] text-slate-400 dark:text-slate-400">
            Left / Voice 1
          </span>
        </div>

        <!-- Pill Input Form -->
        <form id="chatForm" class="relative flex items-center">
          <input 
            type="text" 
            id="messageInput" 
            autocomplete="off" 
            placeholder="Type here..." 
            class="w-full py-3.5 pl-5 pr-12 bg-[#cbd5e1]/50 dark:bg-slate-800/80 focus:bg-slate-200/80 dark:focus:bg-slate-800 rounded-full text-[16px] text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:outline-none border border-transparent dark:border-slate-700/60 transition-all"
          />
          <button 
            type="submit" 
            id="sendBtn" 
            aria-label="Send" 
            class="theme-accent-btn absolute right-1.5 w-9 h-9 rounded-full text-white flex items-center justify-center active:scale-95 transition-transform disabled:opacity-40"
          >
            <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>
      </footer>
    </section>

    <!-- ========================================== -->
    <!-- SETTINGS MODAL                             -->
    <!-- ========================================== -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/50 dark:bg-black/75 backdrop-blur-xs flex items-end justify-center transition-opacity">
      <div class="w-full max-w-md bg-white dark:bg-appDarkSurface rounded-t-3xl p-5 pb-safe space-y-4 border-t border-slate-100 dark:border-slate-800 max-h-[85vh] overflow-y-auto no-scrollbar">
        <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-1"></div>
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900 dark:text-white">Settings</h3>
          <button id="btnCloseSettings" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Dark Mode / Light Mode Toggle -->
        <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-amber-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold text-slate-800 dark:text-white">Dark Mode</p>
              <p class="text-xs text-slate-400">Switch app appearance</p>
            </div>
          </div>
          <button id="settingsDarkModeToggle" type="button" class="w-12 h-6 bg-slate-300 dark:bg-emerald-500 rounded-full p-0.5 flex items-center transition-colors">
            <div id="settingsDarkKnob" class="w-5 h-5 bg-white rounded-full shadow transform transition-transform"></div>
          </button>
        </div>

        <!-- Auto Switch Perspective Toggle -->
        <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold text-slate-800 dark:text-white">Auto Alternate Voice</p>
              <p class="text-xs text-slate-400">Switch sides automatically after sending</p>
            </div>
          </div>
          <button id="settingsAutoSwitchToggle" type="button" class="w-12 h-6 bg-slate-300 dark:bg-emerald-500 rounded-full p-0.5 flex items-center transition-colors">
            <div id="settingsAutoSwitchKnob" class="w-5 h-5 bg-white rounded-full shadow transform transition-transform"></div>
          </button>
        </div>

        <!-- Font Selector -->
        <div class="p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">App Font</label>
          <div class="grid grid-cols-1 gap-2" id="fontSelectorGroup">
            <button data-font="Inter" class="font-opt px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-left text-sm flex items-center justify-between font-inter">
              <span>Inter (Default)</span>
              <span class="text-xs text-slate-400">Modern Clean</span>
            </button>
            <button data-font="Cantarell" class="font-opt px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-left text-sm flex items-center justify-between font-cantarell">
              <span>Cantarell</span>
              <span class="text-xs text-slate-400">Calm / Humanist</span>
            </button>
            <button data-font="Alata" class="font-opt px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-left text-sm flex items-center justify-between font-alata">
              <span>Alata</span>
              <span class="text-xs text-slate-400">Calm / Geometric</span>
            </button>
          </div>
        </div>

        <!-- Text Side (Alignment) Selector -->
        <div class="p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Message Text Alignment</label>
          <div class="grid grid-cols-3 gap-2" id="textAlignSelectorGroup">
            <button data-align="left" class="align-opt py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-medium flex items-center justify-center space-x-1">
              <span>Left</span>
            </button>
            <button data-align="center" class="align-opt py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-medium flex items-center justify-center space-x-1">
              <span>Center</span>
            </button>
            <button data-align="right" class="align-opt py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-medium flex items-center justify-center space-x-1">
              <span>Right</span>
            </button>
          </div>
        </div>

        <!-- App Color Theme Selector -->
        <div class="p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">App Color Theme</label>
          <div class="grid grid-cols-2 gap-2" id="colorThemeSelectorGroup">
            <button data-theme="emerald-ocean" class="theme-opt p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center space-x-2">
              <span class="flex -space-x-1">
                <span class="w-4 h-4 rounded-full bg-[#00bf57]"></span>
                <span class="w-4 h-4 rounded-full bg-[#009abb]"></span>
              </span>
              <span class="text-xs font-medium">Emerald Ocean</span>
            </button>

            <button data-theme="sunset-coral" class="theme-opt p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center space-x-2">
              <span class="flex -space-x-1">
                <span class="w-4 h-4 rounded-full bg-[#ff6b6b]"></span>
                <span class="w-4 h-4 rounded-full bg-[#ffa94d]"></span>
              </span>
              <span class="text-xs font-medium">Sunset Coral</span>
            </button>

            <button data-theme="violet-indigo" class="theme-opt p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center space-x-2">
              <span class="flex -space-x-1">
                <span class="w-4 h-4 rounded-full bg-[#8b5cf6]"></span>
                <span class="w-4 h-4 rounded-full bg-[#3b82f6]"></span>
              </span>
              <span class="text-xs font-medium">Violet Indigo</span>
            </button>

            <button data-theme="rose-amber" class="theme-opt p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center space-x-2">
              <span class="flex -space-x-1">
                <span class="w-4 h-4 rounded-full bg-[#ec4899]"></span>
                <span class="w-4 h-4 rounded-full bg-[#f59e0b]"></span>
              </span>
              <span class="text-xs font-medium">Rose Amber</span>
            </button>
          </div>
        </div>

      </div>
    </div>

<!-- ========================================== -->
    <!-- CHAT ACTIONS MODAL                         -->
    <!-- ========================================== -->
    <div id="actionSheetModal" class="hidden fixed inset-0 z-50 bg-black/50 dark:bg-black/70 backdrop-blur-xs flex items-end justify-center transition-opacity">
      <div class="w-full max-w-md bg-white dark:bg-appDarkSurface rounded-t-3xl p-5 pb-safe space-y-3 border-t border-slate-100 dark:border-slate-800">
        <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-2"></div>
        <h3 id="modalChatTitle" class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider text-center truncate">Options</h3>
        
        <div class="space-y-1">
          <button id="modalBtnRename" class="w-full py-3 px-4 rounded-xl flex items-center space-x-3 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 text-left font-medium active:bg-slate-200 dark:active:bg-slate-700 transition">
